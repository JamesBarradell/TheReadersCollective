services:
  - type: web
    name: the-readers-collective-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: readers-collective-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://www.thereaderscollective.com,https://thereaderscollective.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: APP_BASE_URL
        value: https://www.thereaderscollective.com
      - key: READERS_CORNER_DATA_DIR
        value: /var/data/database
      - key: READERS_COLLECTIVE_UPLOADS_DIR
        value: /var/data/uploads