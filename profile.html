<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reader Profile | The Readers Collective</title>
	<script src="config.js"></script>
	<script src="app/theme.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<script src="https://unpkg.com/lucide@latest"></script>
	<script type="module" src="profile.js"></script>
</head>
<body>
	<main class="wrap reader-profile-page">
		<header class="reader-profile-header">
			<a class="icon-btn" href="app.html" aria-label="Back to The Readers Collective" title="Back to The Readers Collective"><i data-lucide="arrow-left" aria-hidden="true"></i></a>
			<button class="icon-btn" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme"><i data-lucide="moon" aria-hidden="true"></i></button>
		</header>
		<section id="reader-profile-content" aria-live="polite">
			<p class="profile-loading">Loading reader profile...</p>
		</section>
	</main>
</body>
</html>
