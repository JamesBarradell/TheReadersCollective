<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The Readers Collective Login</title>
	<script src="app/theme.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
	<main class="wrap auth-wrap">
		<section class="panel hero auth-hero">
			<button id="theme-toggle-btn" class="icon-btn theme-toggle-corner" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode"><i data-lucide="moon" aria-hidden="true"></i></button>
			<h1>The Readers Collective</h1>
			<p>Sign in to open your shelf, track your books, and chat with friends about what you are reading.</p>
		</section>

		<section class="panel auth-panel-page">
			<div class="grid single-column">
				<article>
					<h2 class="card-title">Welcome Back</h2>
					<div class="auth-columns auth-columns-single">
						<form id="auth-form" class="auth-card">
							<h3>Sign In Or Create Account</h3>
							<div class="field">
								<label for="auth-username">Username</label>
								<input id="auth-username" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="Needed to create an account">
							</div>
							<div class="field">
								<label for="auth-email">Email</label>
								<input id="auth-email" name="email" type="email" required placeholder="reader@example.com">
							</div>
							<div class="field">
								<label for="auth-password">Password</label>
								<input id="auth-password" name="password" type="password" required minlength="6" placeholder="At least 6 characters">
							</div>
							<div class="checkbox-row remember-me-row">
								<input id="remember-me" name="rememberMe" type="checkbox" checked>
								<label for="remember-me">Remember me on this device</label>
							</div>
							<div class="btn-row">
								<button class="btn-main" type="submit" name="authAction" value="login">Sign In</button>
								<button class="btn-sub" type="submit" name="authAction" value="register">Create Account</button>
							</div>
							<button id="forgot-password-btn" class="text-action" type="button">Forgot password?</button>
							<div class="auth-divider"><span>or</span></div>
							<div id="google-signin" class="google-signin"></div>
							<p id="google-status" class="hint google-status"></p>
							<p id="auth-status" class="hint">Create a new account or sign in to your existing one.</p>
						</form>
					</div>
				</article>
			</div>
		</section>
	</main>
	<dialog id="forgot-password-dialog" class="app-dialog compact-dialog">
		<div class="dialog-heading">
			<h2>Reset Password</h2>
			<button id="close-forgot-password" class="icon-btn" type="button" aria-label="Close password reset" title="Close"><i data-lucide="x" aria-hidden="true"></i></button>
		</div>
		<form id="forgot-password-form" class="auth-card">
			<div class="field">
				<label for="reset-email">Email</label>
				<input id="reset-email" type="email" required placeholder="reader@example.com">
			</div>
			<button class="btn-main" type="submit">Send Reset Link</button>
			<p id="reset-request-status" class="hint"></p>
		</form>
	</dialog>

	<script src="login.js" defer></script>
</body>
</html>
